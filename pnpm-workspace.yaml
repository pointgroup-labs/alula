shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar
  - semver
  - '@noble/hashes@1.7.0'
  - '@noble/curves@1.8.0'
  - slow-redact

packages:
  - packages/*
ignoredBuiltDependencies:
  - bigint-buffer
  - bufferutil
  - esbuild
  - keccak
  - protobufjs
  - secp256k1
  - unix-dgram
  - utf-8-validate
  - vue-demi
onlyBuiltDependencies:
  - unrs-resolver
