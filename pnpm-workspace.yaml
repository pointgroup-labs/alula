minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver

shellEmulator: true

packages:
  - packages/*

overrides:
  # @vue/compiler-sfc (via @antfu/eslint-config) pins an 8.5.12 that is behind
  # GHSA-r28c-9q8g-f849 and GHSA-fxqj-rqcc-2cmp; ^8.5.23 also lifts nanoid to 3.3.18.
  postcss: ^8.5.23

allowBuilds:
  '@stellar/stellar-sdk': false
  esbuild: false
