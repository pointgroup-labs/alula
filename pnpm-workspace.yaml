shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar
  - semver
  - '@noble/hashes@1.7.0'
  - '@noble/curves@1.8.0'
  - slow-redact

packages:
  - packages/*
allowBuilds:
  '@stellar/stellar-sdk': false
  bigint-buffer: false
  blake-hash: false
  bufferutil: false
  esbuild: false
  keccak: false
  protobufjs: false
  secp256k1: false
  tiny-secp256k1: false
  unix-dgram: false
  unrs-resolver: true
  usb: false
  utf-8-validate: false
