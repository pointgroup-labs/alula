name: Deploy UI DEV

on:
  workflow_dispatch:

  push:
    branches:
      - dev
      # - stage
      # - main
    paths:
      - packages/ui/nuxt.config.ts
      - packages/ui/public/**
      - packages/ui/src/**

env:
  WORKDIR: packages/ui

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          pnpm run build:ssg
          cp .output/public/index.html .output/public/404.html || true
          touch .output/public/.nojekyll || true
        working-directory: ${{ env.WORKDIR }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WORKDIR }}/.output/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
