name: Deploy Webapp DEV

on:
  workflow_dispatch:

  push:
    branches:
      - dev
      # - stage
      # - main
    paths:
      - packages/webapp/nuxt.config.ts
      - packages/webapp/public/**
      - packages/webapp/src/**

env:
  WORKDIR: packages/webapp

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          pnpm run build:staging:ssg
          cp dist/index.html dist/404.html && touch dist/.nojekyll
        working-directory: ${{ env.WORKDIR }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.WORKDIR }}/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
