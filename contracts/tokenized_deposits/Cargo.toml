[package]
name = "tokenized_deposits"
version = "0.0.0"
edition = { workspace = true }
license = { workspace = true }
publish = false
# Pin to the repository root workspace: an unrelated `contracts/Cargo.toml` would
# otherwise be picked up as the nearest workspace root
workspace = "../.."

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
market = { workspace = true }
soroban-fixed-point-math = { workspace = true }
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
