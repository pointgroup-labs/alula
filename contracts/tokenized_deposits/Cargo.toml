[package]
name = "tokenized_deposits"
version = "0.0.0"
edition = { workspace = true }
license = { workspace = true }
publish = false
# Pin to the repository root workspace: an unrelated `contracts/Cargo.toml` would
# otherwise be picked up as the nearest workspace root
workspace = "../.."

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# NB: the `market` crate is deliberately *not* a dependency. It is itself a `cdylib` contract, and
# linking two contracts into one wasm yields duplicate exported symbols (`deposit`, `borrow`, ...).
# The market's types are mirrored structurally in `src/market.rs` instead
soroban-fixed-point-math = { workspace = true }
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
