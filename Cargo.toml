[workspace]
resolver = "2"
members = ["contracts/*", "insurance_fund_trait", "moderc3156", "tests", "tests/fuzz"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
enum_dispatch = "0.3.13"
sep-40-oracle = "^1.3.0"
soroban-fixed-point-math = "^1.4.0"
soroban-sdk = "^23.0.0"
insurance-fund-trait = { path = "insurance_fund_trait" }
moderc3156 = { path = "moderc3156" }
market = { path = "contracts/market/" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
