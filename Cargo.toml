[workspace]
resolver = "3"
members = ["contracts/*", "libs/*", "tests", "tests/fuzz"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
enum_dispatch = "0.3.13"
farms-interface = { path = "libs/farms-interface" }
insurance-fund-interface = { path = "libs/insurance-fund-interface" }
market = { path = "contracts/market" }
moderc3156 = { path = "libs/moderc3156" }
proxy-swap-interface = { path = "libs/proxy-swap-interface" }
sep-40-oracle = "^1.3.0"
soroban-fixed-point-math = "^1.4.0"
soroban-sdk = "^25.3.1"

[profile.release]
opt-level = "z" # Optimize for size
overflow-checks = true
debug = 0
strip = "symbols" # Remove debug symbols
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Release profile with debug assertions for logging
# See: https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
