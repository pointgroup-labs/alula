name = "alula-multisig-worker"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# Bind a KV namespace named SIGS. Create with:
#   wrangler kv namespace create SIGS
# Then paste the returned id below.
[[kv_namespaces]]
binding = "SIGS"
id = "REPLACE_ME_AFTER_kv_namespace_create"

# Route mount point — keep in sync with the webapp's RelayConfig.baseUrl.
# Example for production:
# routes = [
#   { pattern = "app.alula.fi/api/multisig/*", zone_name = "alula.fi" }
# ]
